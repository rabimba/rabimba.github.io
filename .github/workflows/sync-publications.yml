# Weekly sync of new/enriched publications (OpenAlex + arXiv + Semantic Scholar + DBLP),
# Blogger posts (rkrants.blogspot.com), and GitHub repository audit.
# Changes are committed to a branch and opened as a single review PR.

name: Sync publications and blog

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-publications
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync publications (OpenAlex + arXiv + Semantic Scholar + DBLP)
        run: python scripts/sync_publications.py

      - name: Sync blog posts (Blogger Atom feed)
        run: python scripts/sync_blog.py

      - name: Export publications data YAML
        run: python scripts/fetch_scholar.py --export-only

      - name: Audit GitHub repositories
        run: python scripts/sync_github.py --report-file /tmp/github_report.md

      - name: Open PR if there are content updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$(git status --porcelain content/publication content/blog data/publications.yaml)" ]]; then
            echo "No new or updated publications/blog posts — nothing to do."
            exit 0
          fi
          BR="site-sync/$(date +%Y-%m-%d)-${{ github.run_id }}"
          git config user.name "site-sync-bot"
          git config user.email "actions@github.com"
          git checkout -b "$BR"
          git add content/publication content/blog data/publications.yaml
          git commit -m "content: automated sync of publications and blog posts"
          git push origin "$BR"
          BODY="Automated weekly sync detected new or enriched publications and/or Blogger posts. Review the changes before merging."
          if [[ -f /tmp/github_report.md ]]; then
            BODY="$BODY"$'\n\n'"$(cat /tmp/github_report.md)"
          fi
          gh pr create \
            --title "Automated site sync: publications & blog ($(date +%Y-%m-%d))" \
            --body "$BODY" \
            --base main --head "$BR"
