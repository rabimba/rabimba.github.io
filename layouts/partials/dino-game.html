<div class="dino-footer">
  <canvas id="dino-canvas" role="img" aria-label="Dino game — click or tap to play"></canvas>
</div>
<style>
.dino-footer {
  position: relative;
  width: 100%;
  height: 80px;
  margin-top: 0.5rem;
  cursor: pointer;
  background: #f9fafb;
}
.dark .dino-footer, html.dark .dino-footer {
  background: #111827;
}
.dino-footer canvas {
  display: block;
  width: 100%;
  height: 80px;
}
</style>
<script>
(function () {
  var wrap = document.querySelector('.dino-footer');
  var canvas = document.getElementById('dino-canvas');
  var ctx = canvas.getContext('2d');

  var W, H = 80, GROUND = 64, PX = 2;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  /* Full-bleed sizing that never causes horizontal overflow:
     width = document clientWidth (excludes scrollbar), shifted by the
     parent's offset so the strip spans the real viewport edge-to-edge. */
  function sizeWrap() {
    var vw = document.documentElement.clientWidth;
    if (!vw) return;
    var left = wrap.parentElement.getBoundingClientRect().left;
    wrap.style.width = vw + 'px';
    wrap.style.marginLeft = (-left) + 'px';
  }

  function resize() {
    sizeWrap();
    var rect = wrap.getBoundingClientRect();
    W = Math.max(rect.width, 1);
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (state) render(); /* skip until game vars initialized */
  }

  sizeWrap(); resize();
  setTimeout(resize, 50);
  setTimeout(resize, 200);
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(resize).observe(wrap.parentElement || wrap);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  /* Colors */
  function dark() {
    return document.documentElement.classList.contains('dark')
        || document.body.classList.contains('dark')
        || window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function C() {
    if (dark()) return {bg:'#111827', d:'#d1d5db', g:'#374151', dl:'#6b7280',
                         c:'#9ca3af', cl:'rgba(255,255,255,0.12)', e:'#111827'};
    return {bg:'#f9fafb', d:'#374151', g:'#9ca3af', dl:'#d1d5db',
            c:'#6b7280', cl:'rgba(0,0,0,0.08)', e:'#ffffff'};
  }

  /* Pixel bitmaps */
  var BODY = [
    "00000000111111100",
    "00000001111111110",
    "00000001111011110",
    "00000001111111110",
    "00000001111111110",
    "00000000111111100",
    "00111111111110000",
    "11111111111110000",
    "11111111111100000",
    "11111111110000000",
    "01111111110000000",
    "00111111110000000",
    "00111110000000000",
    "00111110000000000",
    "00111110000000000",
    "00111100000000000",
    "00111000000000000",
  ];
  var LA = ["00111000010000000", "00111000010000000"];
  var LB = ["00010000111000000", "00010000111000000"];
  var CS = ["00100","00100","00100","01110","01110","00100","00100","00100","01110","01110","00100","00100"];
  var CL = ["0001000","0001000","0001000","0011100","0011100","0001000","0001000","0011100","0011100","0001000","0001000","0001000","0011100","0011100","0001000","0001000","0001000","0001000"];

  function bmp(arr,x,y,color){
    ctx.fillStyle=color;
    for(var r=0;r<arr.length;r++)for(var c=0;c<arr[r].length;c++)
      if(arr[r][c]==='1')ctx.fillRect(x+c*PX,y+r*PX,PX,PX);
  }

  var state='idle', score=0, hi=0, frame=0, speed=5, spawn=0;
  try{hi=parseInt(localStorage.getItem('dinohi')||'0',10)||0}catch(e){}
  var dino={x:50,y:GROUND,vy:0,on:true,leg:0}, obs=[], cl=[];
  var touch='ontouchstart'in window||navigator.maxTouchPoints>0;
  var hint=touch?'tap to play':'click to play \u00b7 space jumps';

  function jump(){if(dino.on){dino.vy=-10;dino.on=false}}
  function rst(){dino.y=GROUND;dino.vy=0;dino.on=true;obs=[];cl=[];speed=5;score=0;frame=0;spawn=0}
  function start(){rst();state='running';canvas.classList.add('dino-active')}

  function addObs(){
    var big=Math.random()<0.25, b=big?CL:CS;
    obs.push({x:W+20,b:b,w:b[0].length*PX,h:b.length*PX});
  }
  function addCl(){cl.push({x:W+20,y:10+Math.random()*16,w:20+Math.random()*14})}

  function drawD(c){var hh=BODY.length*PX, dy=GROUND-hh+(dino.y-GROUND);
    bmp(BODY,dino.x,dy,c.d);
    if(state==='running'&&dino.on){dino.leg=(dino.leg+1)%10;bmp(dino.leg<5?LA:LB,dino.x,dy+hh,c.d)}
    else bmp(LA,dino.x,dy+hh,c.d);
    ctx.fillStyle=c.e;ctx.fillRect(dino.x+11*PX,dy+2*PX,PX,PX);}
  function drawO(o,c){bmp(o.b,o.x,GROUND-o.h,c.c)}
  function drawCL(cc,c){ctx.fillStyle=c.cl;ctx.fillRect(cc.x,cc.y,cc.w,3);ctx.fillRect(cc.x+4,cc.y-2,cc.w-8,2);ctx.fillRect(cc.x+2,cc.y+3,cc.w-4,2)}
  function drawG(c){ctx.fillStyle=c.g;ctx.fillRect(0,GROUND+2,W,1);
    ctx.fillStyle=c.dl;var o=(frame*speed)%32;
    for(var i=-o;i<W;i+=32)ctx.fillRect(i,GROUND+6,14,1);}
  function drawSc(c){if(state==='idle')return;
    ctx.fillStyle=c.d;ctx.globalAlpha=0.5;ctx.font='600 10px system-ui,sans-serif';ctx.textAlign='right';
    var l=String(score).padStart(5,'0');if(hi>0)l+='  HI '+String(hi).padStart(5,'0');
    ctx.fillText(l,W-12,16);ctx.globalAlpha=1;}
  function drawHi(c){if(state!=='idle')return;
    var t=Date.now()*0.001,p=0.25+0.2*Math.sin(t*2.5);
    ctx.fillStyle=c.d;ctx.globalAlpha=p;ctx.font='600 12px system-ui,sans-serif';ctx.textAlign='center';
    ctx.fillText(hint,W/2,GROUND-24);ctx.globalAlpha=1;}
  function drawOv(c){ctx.fillStyle=c.d;ctx.globalAlpha=0.08;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=0.6;ctx.font='700 14px system-ui,sans-serif';ctx.textAlign='center';
    ctx.fillText('GAME OVER',W/2,GROUND-20);
    ctx.font='600 11px system-ui,sans-serif';ctx.globalAlpha=0.4;
    ctx.fillText('score '+score+'  best '+hi+'  '+(touch?'tap to retry':'click or space to retry'),W/2,GROUND-4);ctx.globalAlpha=1;}

  function hit(o){
    var dx=dino.x+3*PX, dy=GROUND-BODY.length*PX+(dino.y-GROUND)+2, dw=13*PX, dh=16*PX;
    return dx<o.x+o.w-PX&&dx+dw>o.x+PX&&dy<GROUND&&dy+dh>GROUND-o.h+2;}

  function upd(){
    frame++;score=Math.floor(frame/6);
    if(score>0&&score%100===0)speed=Math.min(speed+0.3,11);
    if(!dino.on){dino.y+=dino.vy;dino.vy+=0.55;if(dino.y>=GROUND){dino.y=GROUND;dino.vy=0;dino.on=true}}
    spawn--;if(spawn<=0){addObs();spawn=55+Math.random()*55}
    if(frame%80===0&&Math.random()<0.5)addCl();
    for(var i=obs.length-1;i>=0;i--){obs[i].x-=speed;if(obs[i].x+obs[i].w<0){obs.splice(i,1);continue}if(hit(obs[i])){state='over';if(score>hi){hi=score;try{localStorage.setItem('dinohi',hi)}catch(e){}}canvas.classList.remove('dino-active')}}
    for(var j=cl.length-1;j>=0;j--){cl[j].x-=speed*0.35;if(cl[j].x+cl[j].w<0)cl.splice(j,1)}}

  function render(){
    if(!W||W<10)return;
    var c=C();
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle=c.bg;ctx.fillRect(0,0,W,H);
    drawG(c);
    for(var i=0;i<cl.length;i++)drawCL(cl[i],c);
    for(var j=0;j<obs.length;j++)drawO(obs[j],c);
    drawD(c);
    drawSc(c);
    drawHi(c);
    if(state==='over')drawOv(c);
  }

  /* Pause rendering while the strip is off-screen (battery + smooth page) */
  var inView = true;
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function(en){ inView = en[0].isIntersecting; }).observe(wrap);
  }
  function loop(){ if(inView){ if(state==='running') upd(); render(); } requestAnimationFrame(loop) }
  loop();

  /* Input: click/tap always works. Keyboard only after the player engages
     with the strip, and only while it is on-screen — never hijacks scrolling. */
  var engaged = false, last = 0;
  function inp(){
    var now=Date.now();if(now-last<80)return;last=now;
    if(state==='idle'||state==='over')start();else if(state==='running')jump();
  }
  wrap.addEventListener('click',function(){engaged=true;inp()});
  /* Touch: only swallow the gesture once the game is actually running.
     When idle, let the touch become a normal scroll/tap (click still starts). */
  wrap.addEventListener('touchstart',function(e){if(state==='running'){e.preventDefault();}engaged=true;inp()},{passive:false});
  document.addEventListener('keydown',function(e){
    if(e.code!=='Space'&&e.code!=='ArrowUp')return;
    if(!engaged||!inView||state==='idle')return;
    e.preventDefault();inp();
  });
})();
</script>
