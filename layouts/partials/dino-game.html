<div class="dino-footer">
  <canvas id="dino-canvas" aria-label="Dino game — press space or click to play"></canvas>
</div>
<style>
.dino-footer {
  position: relative;
  width: 100%;
  height: 80px;
  margin-top: 0.5rem;
  cursor: pointer;
}
.dino-footer canvas {
  display: block;
  width: 100%;
  height: 80px;
  opacity: 0.55;
  transition: opacity 0.4s ease;
}
.dino-footer:hover canvas,
.dino-footer canvas.dino-active {
  opacity: 1;
}
</style>
<script>
(function () {
  var wrap = document.querySelector('.dino-footer');
  var canvas = document.getElementById('dino-canvas');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  var W = 0, H = 80;
  var GROUND = 64;

  function resize() {
    var rect = wrap.getBoundingClientRect();
    W = rect.width;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  var state = 'idle'; // idle | running | over
  var score = 0, hi = 0;
  try { hi = parseInt(localStorage.getItem('dinohi') || '0', 10) || 0; } catch (e) {}

  var dino = { x: 50, y: GROUND, w: 22, h: 26, vy: 0, onGround: true, legFrame: 0 };
  var obstacles = [];
  var clouds = [];
  var speed = 5;
  var frame = 0;
  var spawnTimer = 0;

  function jump() {
    if (dino.onGround) { dino.vy = -10; dino.onGround = false; }
  }

  function reset() {
    dino.y = GROUND; dino.vy = 0; dino.onGround = true;
    obstacles = []; speed = 5; score = 0; frame = 0; spawnTimer = 0;
  }

  function start() {
    reset();
    state = 'running';
    canvas.classList.add('dino-active');
  }

  function spawnObstacle() {
    var big = Math.random() < 0.3;
    obstacles.push({
      x: W + 20,
      w: big ? 16 : 12,
      h: big ? 28 : 20,
      big: big
    });
  }

  function spawnCloud() {
    clouds.push({ x: W + 20, y: 10 + Math.random() * 20, w: 18 + Math.random() * 14 });
  }

  function drawDino() {
    var x = dino.x, y = GROUND - dino.h + (dino.y - GROUND);
    ctx.fillStyle = 'currentColor';
    // body
    ctx.fillRect(x + 8, y + 4, 12, 10);
    // head
    ctx.fillRect(x + 14, y, 10, 8);
    // tail
    ctx.fillRect(x + 2, y + 6, 8, 6);
    // legs — animate
    if (dino.onGround) {
      dino.legFrame = (dino.legFrame + 1) % 8;
      if (dino.legFrame < 4) {
        ctx.fillRect(x + 8, y + 14, 4, 12);
        ctx.fillRect(x + 16, y + 14, 4, 8);
      } else {
        ctx.fillRect(x + 8, y + 14, 4, 8);
        ctx.fillRect(x + 16, y + 14, 4, 12);
      }
    } else {
      ctx.fillRect(x + 8, y + 14, 4, 10);
      ctx.fillRect(x + 16, y + 14, 4, 10);
    }
    // eye (white pixel)
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 20, y + 2, 2, 2);
  }

  function drawObstacle(o) {
    var x = o.x, y = GROUND - o.h;
    ctx.fillStyle = 'currentColor';
    // cactus trunk
    ctx.fillRect(x + o.w / 2 - 2, y, 4, o.h);
    // arms
    if (o.big) {
      ctx.fillRect(x, y + 6, 4, 10);
      ctx.fillRect(x + o.w - 4, y + 4, 4, 12);
    } else {
      ctx.fillRect(x + 1, y + 5, 3, 8);
    }
  }

  function drawCloud(c) {
    ctx.fillStyle = 'currentColor';
    ctx.globalAlpha = 0.25;
    ctx.fillRect(c.x, c.y, c.w, 4);
    ctx.fillRect(c.x + 4, c.y - 2, c.w - 8, 2);
    ctx.fillRect(c.x + 2, c.y + 4, c.w - 4, 2);
    ctx.globalAlpha = 1;
  }

  function drawGround() {
    ctx.fillStyle = 'currentColor';
    ctx.globalAlpha = 0.35;
    ctx.fillRect(0, GROUND + 2, W, 1);
    // dashes
    var off = (frame * speed) % 24;
    for (var i = -off; i < W; i += 24) {
      ctx.fillRect(i, GROUND + 5, 10, 1);
    }
    ctx.globalAlpha = 1;
  }

  function drawScore() {
    if (state === 'idle') return;
    ctx.fillStyle = 'currentColor';
    ctx.globalAlpha = 0.5;
    ctx.font = '600 10px system-ui, sans-serif';
    ctx.textAlign = 'right';
    var label = String(score).padStart(5, '0');
    if (hi > 0) label += '  HI ' + String(hi).padStart(5, '0');
    ctx.fillText(label, W - 8, 14);
    ctx.globalAlpha = 1;
  }

  function drawIdle() {
    ctx.fillStyle = 'currentColor';
    ctx.globalAlpha = 0.4;
    ctx.font = '600 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('press space or click to play', W / 2, GROUND - 18);
    ctx.globalAlpha = 1;
  }

  function drawOver() {
    ctx.fillStyle = 'currentColor';
    ctx.globalAlpha = 0.08;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 0.6;
    ctx.font = '700 13px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, GROUND - 16);
    ctx.font = '600 10px system-ui, sans-serif';
    ctx.globalAlpha = 0.4;
    ctx.fillText('score ' + score + ' · best ' + hi + ' · click to retry', W / 2, GROUND - 2);
    ctx.globalAlpha = 1;
  }

  function collide(o) {
    var dx = dino.x + 6, dy = GROUND - dino.h + (dino.y - GROUND) + 2;
    var dw = dino.w - 10, dh = dino.h - 4;
    return dx < o.x + o.w && dx + dw > o.x &&
           dy < GROUND - o.h + o.h && dy + dh > GROUND - o.h;
  }

  function update() {
    frame++;
    score = Math.floor(frame / 6);
    if (score > 0 && score % 100 === 0) speed = Math.min(speed + 0.3, 11);

    // physics
    if (!dino.onGround) {
      dino.y += dino.vy;
      dino.vy += 0.55;
      if (dino.y >= GROUND) { dino.y = GROUND; dino.vy = 0; dino.onGround = true; }
    }

    // spawn
    spawnTimer--;
    if (spawnTimer <= 0) {
      spawnObstacle();
      spawnTimer = 50 + Math.random() * 60;
    }
    if (frame % 90 === 0 && Math.random() < 0.5) spawnCloud();

    // move + collision
    for (var i = obstacles.length - 1; i >= 0; i--) {
      obstacles[i].x -= speed;
      if (obstacles[i].x + obstacles[i].w < 0) { obstacles.splice(i, 1); continue; }
      if (collide(obstacles[i])) {
        state = 'over';
        if (score > hi) { hi = score; try { localStorage.setItem('dinohi', hi); } catch (e) {} }
        canvas.classList.remove('dino-active');
      }
    }
    for (var j = clouds.length - 1; j >= 0; j--) {
      clouds[j].x -= speed * 0.4;
      if (clouds[j].x + clouds[j].w < 0) clouds.splice(j, 1);
    }
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawGround();
    for (var i = 0; i < clouds.length; i++) drawCloud(clouds[i]);
    for (var j = 0; j < obstacles.length; j++) drawObstacle(obstacles[j]);
    drawDino();
    drawScore();
    if (state === 'idle') drawIdle();
    else if (state === 'over') drawOver();
  }

  function loop() {
    if (state === 'running') update();
    render();
    requestAnimationFrame(loop);
  }

  function handleInput() {
    if (state === 'idle') start();
    else if (state === 'over') start();
    else if (state === 'running') jump();
  }

  wrap.addEventListener('click', handleInput);
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      if (state === 'running' || state === 'idle' || state === 'over') {
        e.preventDefault();
        handleInput();
      }
    }
  });

  loop();
})();
</script>
