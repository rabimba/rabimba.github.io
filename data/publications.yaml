- slug: transactqa
  title: 'TxnQA: Benchmarking Analytical Reasoning and Evidence Grounding over Transaction
    Event Sequences'
  authors:
  - Rabimba Karanjai
  - Yiming Bian
  - Yun-Shiuan Chuang
