  abstract: In this era, significant transformations in industries and tool utilization
    are driven by AI/Large Language Models (LLMs) and advancements in Machine Learning.
    There's a growing emphasis on Machine Learning Operations (MLOps) for managing
    and deploying these AI models. Concurrently, the imperative for richer smart contracts
    and on-chain computation is escalating. Our paper introduces an innovative framework
    that integrates blockchain technology, particularly the Cosmos SDK, to facilitate
    on-chain AI inferences. This system, built on WebAssembly (WASM), enables interchain
    communication and deployment of WASM modules executing AI inferences across multiple
    blockchain nodes. We critically assess the framework from feasibility, scalability,
    and model security, with a special focus on its portability and engine-model agnostic
    deployment. The capability to support AI on-chain may enhance and expand the scope
    of smart contracts, and as a result enable new use cases and applications.
