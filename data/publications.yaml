- slug: agents-web3-attack-surface
  title: 'When Agents Act on Web3: An Attack-Surface Survey of MCP, Skills, and Tool
    Calling'
  authors:
  - Rabimba Karanjai
  - Yang Lu
  - Nour Diallo
  - Wujie Xiong
  - Lei Xu
  - Weidong Shi
  date: '2026-08-18T00:00:00Z'
  doi: ''
  publishDate: '2026-08-18T00:00:00Z'
  publication_types:
  - '1'
  publication: BRAINS 2026
  publication_short: BRAINS 2026
  abstract: 'AI agents increasingly act rather than merely read: across the Model
    Context Protocol (MCP) ecosystem, the share of deployed tools that modify external
    state has risen from 27% to 65% of tool use. When agents exercise this authority
    on public blockchains through MCP, skills, and tool calling, the consequences
    of an attack are governed by the blockchain execution layer rather than by conventional
    software assumptions. This survey argues that four properties of that layer (irreversibility,
    signing authority, continuous autonomy, and sequence-level composition) qualitatively
    change the threat model, turning the recoverable failures of generic agent security
    into a standing, irreversible loss. We organize the fragmented MCP-security literature
    into an attack-surface taxonomy, then contribute a Web3 risk-mapping matrix that
    ties each attack class to its amplified impact, the responsible amplifiers, a
    representative mitigation, and the residual gap. We synthesize defenses, including
    emerging blockchain-based mechanisms, and find them improving but insufficient:
    measured protections stop fewer than 30% of attacks, and model-level safety refuses
    fewer than 3%.'
