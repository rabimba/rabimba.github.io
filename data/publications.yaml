  publication_types:
  - '3'
  publication: arXiv preprint arXiv:2306.07984
  publication_short: arXiv
  abstract: 'Bribery is a perilous issue in the real world, especially in an economical
    aspect. This fraudulence is unavoidable, and more importantly, it is more difficult
    to trace in case smart contracts are utilized for bribing on a distributed public
    blockchain. In our paper, we propose a new threat to the security of a blockchain
    system: cross-chain bribery using smart contracts. An arbitrary wealthy briber
    can utilize cross-chain smart contracts to manipulate a consensus mechanism on
    a victim''s blockchain or to disgrace a victim''s blockchain. To better understand
    this threat, our paper proposes a framework to analyze bribery using cross-chain
    smart contracts. We analyze the amount of incentive needed to bribe rational miners
    in a victim''s blockchain and also the full cost of conducting a cross-chain bribery
    attack. The result is that such attacks can be carried out with a reasonable amount
    of money or cryptocurrencies.'
