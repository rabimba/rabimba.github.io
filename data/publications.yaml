  publication: International Workshop on Quantum Computing and Artificial Intelligence
  publication_short: QC+AI 2026
  abstract: We present QuCoWE a framework that learns quantumnative word embeddings
    by training shallow hardwareefficient parameterized quantum circuits PQCs with
    a contrastive skipgram objective Words are encoded by datareuploading circuits
    with controlled ring entanglement similarity is computed via quantum state fidelity
    and passed through a logitfidelity head that aligns scores with the shiftedPMI
    scale of SGNSNoiseContrastive Estimation To maintain trainability we introduce
    an entanglementbudget regularizer based on singlequbit purity that mitigates barren
    plateaus On Text8 and WikiText2 QuCoWE attains competitive intrinsic WordSim353
    SimLex999 and extrinsic SST2 TREC6 performance versus 50100d classical baselines
    while using fewer learned parameters per token All experiments are run in classical
    simulation we analyze depolarizingreadout noise and include errormitigation hooks
    zeronoise extrapolation randomized compiling to facilitate hardware deployment
