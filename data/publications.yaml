- slug: hpc-agent-tester
  title: 'HPCAgentTester: A Multi-Agent LLM Approach for Enhanced HPC Unit Test Generation'
  authors:
  - Rabimba Karanjai
  - Lei Xu
  - Weidong Shi
  date: '2025-11-01T00:00:00Z'
