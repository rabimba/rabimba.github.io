- slug: supporting-heterogeneous-infra
  title: Supporting Heterogeneous TEE for Critical Infrastructure Protection
  authors:
  - Rabimba Karanjai
  - Rowan Collier
  - Zhimin Gao
  - Lin Chen
  - Xinxin Fan
  - Taeweon Suh
  - Weidong Shi
  - Lei Xu
  date: '2023-05-01T00:00:00Z'
  doi: ''
  publishDate: '2023-05-01T00:00:00Z'
  citations: 12
  publication_types:
  - '1'
  publication: ACM AsiaCCS 2023
  publication_short: ACM AsiaCCS 2023
  abstract: Trusted execution environment (TEE) technology has found many applications
    in mitigating various security risks in an efficient manner, which is attractive
    for critical infrastructure protection. First, the natural of critical infrastructure
    requires it to be well protected from various cyber attacks. Second, performance
    is usually important for critical infrastructure and it cannot afford an expensive
    protection mechanism. While a large number of TEE-based critical infrastructure
    protection systems have been proposed to address various security challenges (e.g.,
    secure sensing and reliable control), most existing works ignore one important
    feature, i.e., devices comprised the critical infrastructure may be equipped with
    multiple incompatible TEE technologies and belongs to different owners. This feature
    makes it hard for these devices to establish mutual trust and form a unified TEE
    environment. To address these challenges and fully unleash the potential of TEE
    technology for critical infrastructure protection, we propose DHTee, a decentralized
    coordination mechanism. DHTee uses blockchain technology to support key TEE functions
    in a heterogeneous TEE environment, especially the attestation service. A Device
    equipped with one TEE can interact securely with the blockchain to verify whether
    another potential collaborating device claiming to have a different TEE meets
    the security requirements. DHTee is also flexible and can support new TEE schemes
    without affecting devices using existing TEEs that have been supported by the
    system.
