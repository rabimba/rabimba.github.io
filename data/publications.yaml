- slug: ransomware-3-0
  title: 'Ransomware 3.0: Enhancing Risk Management and Mitigation Options with Proof-of-Decryptability
    and Smart Contracts'
  authors:
  - Xinyu Hou
  - Yang Lu
  - Rabimba Karanjai
  - Lei Xu
  - Weidong Shi
  date: '2025-05-01T00:00:00Z'
