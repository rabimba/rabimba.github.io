- slug: evaluating-quality-randomness
  title: Evaluating the Quality of Randomness and Entropy in Tasks Supported by Large
    Language Models
  authors:
  - Rabimba Karanjai
  - Yang Lu
  - Ranjith Chodavarapu
  - Lei Xu
  - Weidong Shi
  date: '2025-08-01T00:00:00Z'
