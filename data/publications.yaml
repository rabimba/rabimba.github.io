  abstract: Random numbers play a vital role in many decentralized applications (dApps),
    such as gaming and decentralized finance (DeFi) applications. Existing random
    number provision mechanisms can be roughly divided into two categories, on-chain,
    and off-chain. On-chain approaches usually rely on the blockchain as the major
    input and all computations are done by blockchain nodes. The major risk for this
    type of method is that the input itself is susceptible to the adversary's influence.
    Off-chain approaches, as the name suggested, complete the generation without the
    involvement of blockchain nodes and share the result directly with a dApp. These
    mechanisms usually have a strong security assumption and high complexity. To mitigate
