- slug: zkransomware
  title: 'zkRansomware: Proof-of-Data Recoverability and Multi-round Game Theoretic
    Modeling of Ransomware Decisions'
  authors:
  - Xinyu Hou
  - Yang Lu
  - Rabimba Karanjai
  - Lei Xu
  - Weidong Shi
  date: '2026-01-10T00:00:00Z'
  doi: ''
  publishDate: '2026-01-10T00:00:00Z'
  citations: 1
  publication_types:
  - '3'
  publication: arXiv preprint arXiv:2601.06667
  publication_short: arXiv
  abstract: Ransomware is still one of the most serious cybersecurity threats. Victims
    often pay but fail to regain access to their data, while also facing the danger
    of losing data privacy. These uncertainties heavily shape the attacker-victim
    dynamics in decision-making. In this paper, we introduce and analyze zkRansomware.
    This new ransomware model integrates zero-knowledge proofs to enable verifiable
    data recovery and uses smart contracts to enforce multi-round payments while mitigating
    the risk of data disclosure and privacy loss. We show that zkRansomware is technically
    feasible using existing cryptographic and blockchain tools and, perhaps counterintuitively,
    can align incentives between the attacker and the victim. Finally, we develop
    a theoretical decision-making framework for zkRansomware that distinguishes it
    from known ransomware decision models and discusses its implications for ransomware
    risk analysis and response decision support.
