  publication: IEEE ICBC 2023
  publication_short: IEEE ICBC 2023
  abstract: Function-as-a-Service (FaaS) offers a streamlined cloud computing paradigm,
    but existing centralized systems suffer from vendor lock-in and single points
    of failure. We propose DeFaaS, a decentralized FaaS system leveraging blockchain
    technology and decentralized API management. DeFaaS addresses these limitations
    by establishing a secure, transparent registry of functions on a blockchain and
    enabling applications to discover and invoke them. This approach fosters scalability,
    flexibility, enhanced security, and improved reliability. Furthermore, DeFaaS's
    architecture extends beyond decentralized FaaS, supporting other distributed computing
    scenarios like dApps, volunteer computing, and multi-cloud service meshes. DeFaaS
    represents a significant advancement in decentralized computing with the potential
    to unlock a multitude of novel applications and use cases.
