- slug: evaluating-quality-randomness
  title: Evaluating the Quality of Randomness and Entropy in Tasks Supported by Large
    Language Models
  authors:
  - Rabimba Karanjai
  - Yang Lu
  - Ranjith Chodavarapu
  - Lei Xu
  - Weidong Shi
  date: '2025-08-01T00:00:00Z'
  doi: ''
  publishDate: '2025-08-01T00:00:00Z'
  publication_types:
  - '1'
  publication: KDD - Agentic & GenAI Evaluation 2025
  publication_short: KDD - Agentic & GenAI Evaluation 2025
  abstract: The rapid advancement of large language model (LLM) technology has led
    to diverse applications, many of which inherently require randomness, such as
    stochastic decision-making, gaming, scheduling, AI agents, and cryptography-related
    tasks. However, the capabilities of LLMs in handling randomness, particularly
    in generating and utilizing random numbers effectively, remain unclear. This paper
    investigates the capacity of LLMs for handling tasks that involve randomness through
