  publication_types:
  - '1'
  publication: KDD - Agentic & GenAI Evaluation 2025
  publication_short: KDD - Agentic & GenAI Evaluation 2025
  abstract: The rapid advancement of large language model (LLM) technology has led
    to diverse applications, many of which inherently require randomness, such as
    stochastic decision-making, gaming, scheduling, AI agents, and cryptography-related
    tasks. However, the capabilities of LLMs in handling randomness, particularly
    in generating and utilizing random numbers effectively, remain unclear. This paper
    investigates the capacity of LLMs for handling tasks that involve randomness through
    a series of experiments. We designed a set of experiments that consider various
    factors that can influence an LLM's performance in tasks involving randomness,
    such as accessibility to external tools, types of tasks, model states (fresh vs.
    non-fresh), and prompting strategies. The experiments cover a range of tasks,
    including generating random numbers, generating random strings such as passwords,
    shuffling items, and evaluating the quality of randomness using entropy and the
    NIST randomness test-suite. Our findings reveal that while LLMs can generate outputs
    that exhibit some degree of randomness, their performance is inconsistent and
    often deviates significantly from the expected behavior. The analysis of the experimental
    results highlights key limitations and areas where improvement is needed for the
    LLMs to effectively handle tasks involving randomness.
