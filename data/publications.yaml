- slug: adding-flavors-rng
  title: 'Adding All Flavors: A Hybrid Random Number Generator for dApps and Web3'
  authors:
  - Ranjith Chodavarapu
  - Rabimba Karanjai
  - Xinxin Fan
  - Larry Shi
  - Lei Xu
  date: '2024-09-01T00:00:00Z'
  doi: ''
