- slug: synthesizing-public-opinions
  title: 'Synthesizing Public Opinions with LLMs: Role Creation, Impacts, and the
    Future to eDemocracy'
  authors:
  - Rabimba Karanjai
  - Boris Shor
  - Amanda Austin
  - Ryan Kennedy
  - Yang Lu
  - Lei Xu
  - Weidong Shi
  date: '2025-04-01T00:00:00Z'
