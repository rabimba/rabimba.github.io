- slug: cm-dpo-planning
  title: 'CM-DPO: Constraint-Margin Direct Preference Optimization for LLM Planning'
  authors:
  - Rabimba Karanjai
  - Qun Gu
  - Hemanth Hegadehalli Madhavarao
  - Wenhuan Sun
  - Xiaojiao Yu
  - Suryabhan Singh Hada
