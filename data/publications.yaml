  abstract: In democratic societies, the people elect the government and it is expected
    to represent their interests through various decisions and actions. However, the
    relationship between voter opinions and the government's actions is complex, and
    many factors can delay or even transform the translation process so that the government's
    operation does not reflect the voters' interests. Recent advancements in natural
    language processing (NLP) and large language models (LLMs) provide a new opportunity
    to mitigate this challenge. Specifically, we introduce a new framework that leverages
    LLMs to assess public sentiment and preferences and transform citizen input into
    actionable policy recommendations and legislative structures. This translation
    is highly automated and avoids unnecessary human inferences. Compared with current
    practices, the new framework improves government transparency and reduces policy
    unpredictability.
