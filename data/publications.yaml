- slug: us11025643b2
  title: Mobile multi-party digitally signed documents and techniques for using these
    allowing detection of tamper
  authors:
  - Divyesh Jadav
  - Rabimba Karanjai
  - Lawrence Koved
  - Gabriel Alatorre
  date: '2021-06-01T00:00:00Z'
