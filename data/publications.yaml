  publication: US Patent US11025643B2
  publication_short: US Patent US11025643B2
  abstract: Techniques for mobile multi-party digitally signed documents that allow
    detection of tamper. An issuing authority issues an authenticated base digital
    document, and aggregate documents comprising the base document and one or more
    attachments (such as visas or stamps) are created, updated, merged, and verified
    by multiple parties. Using digital signatures, Merkle-tree structures, and optional
    blockchain-based credential stores, updates can be performed and verified both
    online and offline, so that unauthorized modifications, removal of attachments,
    or concurrent changes can be detected and resolved by an arbiter. Assigned to
    International Business Machines Corporation.
